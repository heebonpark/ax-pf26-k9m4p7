<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <title>공유 기간 만료 — 비공개 포트폴리오</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f3f6fa; color: #1f2430; padding: 24px;
    }
    .card {
      max-width: 460px; background: #fff; border: 1px solid #d5dfec; border-radius: 14px;
      padding: 36px 30px; text-align: center; box-shadow: 0 8px 28px rgba(15, 42, 74, 0.08);
    }
    .icon { font-size: 36px; margin-bottom: 12px; }
    h1 { font-size: 18px; color: #0f2a4a; margin: 0 0 10px; }
    p { font-size: 14px; color: #526072; line-height: 1.65; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>공유 기간이 만료되었습니다</h1>
    <p>본 문서는 채용 전형 검토를 위해 일정 기간만 제공된 비공개 자료입니다.<br/>열람이 필요하신 경우 지원자에게 별도 문의해 주세요.</p>
  </div>
</body>
</html>
